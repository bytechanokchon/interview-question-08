<section class="flex justify-center h-screen mt-5">
  <div class="w-[500px]">
    <h1 class="text-3xl">รายการข้อสอบภายในระบบ</h1>
    <div>
      <button
        (click)="router.navigate(['/quiz'])"
        class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-300 cursor-pointer">
        เพิ่มข้อสอบใหม่
      </button>
    </div>

    <section class="mt-4">
      @for(quiz of quizs; track quiz.clientId) {
        <div (click)="goToDetail(quiz.id)" class="w-full bg-gray-200 rounded-lg shadow-md p-2 mb-4 cursor-pointer hover:bg-gray-300 transition duration-300">
          <span>{{ quiz.title }}</span>
        </div>
      }
    </section>
  </div>
</section>
