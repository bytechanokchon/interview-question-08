<section [formGroup]="form">
    <div class="w-full">
        <div class="flex justify-between items-center mb-2">
            <span for="questionTitle" class="block text-sm font-medium text-slate-700">
                หัวข้อคำถามที่ {{ index + 1 }}
            </span>
            @if (!isDisabled) {
            <button (click)="onDeleteQuestion()"
                class="bg-red-400 text-white px-4 py-2 rounded-md hover:bg-red-500 transition duration-300 cursor-pointer">
                ลบ
            </button>
            }
        </div>
        <input id="questionTitle" formControlName="questionTitle" type="text" placeholder="กรุณากรอกหัวข้อคำถาม" class="block w-full rounded-lg border border-slate-300
           bg-white px-3 py-2.5 text-sm text-slate-900
           placeholder:text-slate-400 shadow-sm
           transition duration-200
           focus:border-blue-500 focus:outline-none
           focus:ring-2 focus:ring-blue-100
           hover:border-slate-400" />
    </div>

    <div class="mt-5 mb-5">
        <div class="flex flex-col gap-2">
            <div class="w-full flex gap-2">
                <input type="radio" value="0" formControlName="correctChoice" />
                <input id="resultOptionOne" formControlName="resultOptionOne" type="text" placeholder="กรุณากรอกคำตอบที่ 1" class="block w-full rounded-lg border border-slate-300
                   bg-white px-3 py-2.5 text-sm text-slate-900
                   placeholder:text-slate-400 shadow-sm
                   transition duration-200
                   focus:border-blue-500 focus:outline-none
                   focus:ring-2 focus:ring-blue-100
                   hover:border-slate-400" />
            </div>

            <div class="w-full flex gap-2">
                <input type="radio" value="1" formControlName="correctChoice" />
                <input id="resultOptionTwo" formControlName="resultOptionTwo" type="text" placeholder="กรุณากรอกคำตอบที่ 2" class="block w-full rounded-lg border border-slate-300
                   bg-white px-3 py-2.5 text-sm text-slate-900
                   placeholder:text-slate-400 shadow-sm
                   transition duration-200
                   focus:border-blue-500 focus:outline-none
                   focus:ring-2 focus:ring-blue-100
                   hover:border-slate-400" />
            </div>

            <div class="w-full flex gap-2">
                <input type="radio" value="2" formControlName="correctChoice" />
                <input id="resultOptionThree" formControlName="resultOptionThree" type="text" placeholder="กรุณากรอกคำตอบที่ 3" class="block w-full rounded-lg border border-slate-300
                   bg-white px-3 py-2.5 text-sm text-slate-900
                   placeholder:text-slate-400 shadow-sm
                   transition duration-200
                   focus:border-blue-500 focus:outline-none
                   focus:ring-2 focus:ring-blue-100
                   hover:border-slate-400" />
            </div>

            <div class="w-full flex gap-2">
                <input type="radio" value="3" formControlName="correctChoice" />
                <input id="resultOptionFour" formControlName="resultOptionFour" type="text" placeholder="กรุณากรอกคำตอบที่ 4" class="block w-full rounded-lg border border-slate-300
                   bg-white px-3 py-2.5 text-sm text-slate-900
                   placeholder:text-slate-400 shadow-sm
                   transition duration-200
                   focus:border-blue-500 focus:outline-none
                   focus:ring-2 focus:ring-blue-100
                   hover:border-slate-400" />
            </div>
        </div>
        </div>
</section>
