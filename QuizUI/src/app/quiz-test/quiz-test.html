<section class="flex justify-center h-screen mt-5">
    <div class="w-[500px]">
        <div [formGroup]="form">
            <span for="questionTitle" class="block text-sm font-medium text-slate-700">
                ชื่อข้อสอบ
            </span>
            <input id="questionTitle" formControlName="questionTitle" type="text" placeholder="กรุณากรอกหัวข้อคำถาม" class="block w-full rounded-lg border border-slate-300
                        bg-white px-3 py-2.5 text-sm text-slate-900
                        placeholder:text-slate-400 shadow-sm
                        transition duration-200
                        focus:border-blue-500 focus:outline-none
                        focus:ring-2 focus:ring-blue-100
                        hover:border-slate-400" />
        </div>
        <div class="flex items-center justify-between">
            <div class="flex justify-end gap-2 w-full mt-3 mb-5">
                <button
                    (click)="onSubmit()"
                    class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 transition duration-300 cursor-pointer">
                    ตรวจคำตอบ
                </button>
            </div>
        </div>

        @if (scoreObtain != null && fullScore != null) {
            <div class="flex justify-end">
                <p>คุณได้คะแนน {{ scoreObtain }}/{{fullScore}}</p>
            </div>
        }

        <section class="mt-4 w-full flex flex-col gap-8">
            @for (question of questions; track question.clientId) {
                <app-question-input 
                    [index]="$index" 
                    [question]="question"
                    [isDisabled]="true"
                    (questionChange)="onQuestionChange($event, $index)"
                />
            }
        </section>
    </div>
</section>
